<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — u5er99</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Noto+Sans+KR:wght@300;400;500&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--bg:#FCFCFC; --paper:#FFFFFF; --ink:#0C0C0D; --muted:#4E4E52; --faint:#9A9AA0; --line:#0C0C0D; --grid:#E6E6E8;
    --red:#E62534; --red-d:#C11B29; --codebg:#F3F3F5;
    --head:"Gothic A1",ui-sans-serif,system-ui,sans-serif; --body:"Noto Sans KR",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --sm:"Space Mono",monospace;}
  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:16.5px;line-height:1.82;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .mast{border-bottom:3px solid var(--line);}
  .mast .in{max-width:760px;margin:0 auto;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;}
  .mast .id{font-family:var(--head);font-weight:900;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;}
  .mast .id .sq{width:12px;height:12px;background:var(--red);}
  .mast .back{font-family:var(--sm);font-size:12px;border:2px solid var(--ink);padding:7px 14px;text-transform:uppercase;text-decoration:none;color:var(--ink);}
  .mast .back:hover{background:var(--ink);color:#fff;}
  .head{max-width:760px;margin:0 auto;padding:46px 26px 26px;border-bottom:3px solid var(--line);}
  .head .cat{font-family:var(--sm);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red-d);margin:0 0 14px;}
  .head h1{font-family:var(--head);font-weight:900;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;}
  .head .meta{font-family:var(--sm);font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;}

  .prose{max-width:760px;margin:0 auto;padding:34px 26px 70px;}
  .prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--head);font-weight:800;line-height:1.25;letter-spacing:-.01em;margin:1.8em 0 .6em;}
  .prose h1{font-size:1.7em;} .prose h2{font-size:1.45em;padding-bottom:.2em;border-bottom:2px solid var(--grid);}
  .prose h3{font-size:1.2em;} .prose h3::before{content:"— ";color:var(--red);}
  .prose p{margin:0 0 1.15em;}
  .prose a{color:var(--red-d);text-decoration:none;border-bottom:1.5px solid var(--grid);}
  .prose a:hover{border-color:var(--red);}
  .prose strong{font-weight:700;color:var(--ink);}
  .prose ul,.prose ol{margin:0 0 1.15em;padding-left:1.3em;}
  .prose li{margin:.3em 0;}
  .prose li::marker{color:var(--red);}
  .prose blockquote{margin:1.4em 0;padding:.4em 0 .4em 1.1em;border-left:3px solid var(--red);color:var(--muted);font-style:normal;}
  .prose code{font-family:var(--mono);font-size:.86em;background:var(--codebg);padding:2px 6px;border-radius:4px;}
  .prose pre{background:#0E0E12;color:#E7E7EC;font-family:var(--mono);font-size:13px;line-height:1.6;padding:16px 18px;border-radius:8px;overflow-x:auto;margin:1.4em 0;}
  .prose pre code{background:none;padding:0;font-size:inherit;color:inherit;}
  .prose img{display:block;max-width:100%;height:auto;border:1px solid var(--grid);margin:1.4em 0;}
  .prose hr{border:none;border-top:3px solid var(--line);margin:2em 0;}
  .prose table{width:100%;border-collapse:collapse;font-size:.92em;margin:1.4em 0;}
  .prose th,.prose td{border:1px solid var(--grid);padding:8px 10px;text-align:left;}
  .prose th{background:var(--codebg);font-family:var(--sm);font-size:.85em;text-transform:uppercase;}

  .postnav{max-width:760px;margin:0 auto;padding:0 26px 60px;}
  .postnav a{font-family:var(--sm);font-size:12px;color:var(--red-d);text-transform:uppercase;border-bottom:2px solid var(--red);padding-bottom:2px;text-decoration:none;}
  footer{border-top:3px solid var(--line);}
  footer .in{max-width:760px;margin:0 auto;padding:18px 26px;font-family:var(--sm);font-size:11px;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
</style>
</head>
<body>
<header class="mast"><div class="in">
  <a class="id" href="{{ '/' | relative_url }}"><span class="sq"></span>u5er99 — 김상현</a>
  <a class="back" href="{{ '/' | relative_url }}">← Blog</a>
</div></header>

<div class="head">
  {% if page.categories.size > 0 %}<p class="cat">{{ page.categories | join: " · " | downcase }}</p>{% endif %}
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: "%Y.%m.%d" }} · 김상현</div>
</div>

<article class="prose">
  {{ content }}
</article>

<div class="postnav"><a href="{{ '/' | relative_url }}">← 목록으로</a></div>

<footer><div class="in"><span>© {{ site.time | date: "%Y" }} Kim SangHyeon</span><span><a href="{{ '/cv/' | relative_url }}" style="color:inherit;text-decoration:none;">CV</a> · <a href="{{ '/archives/' | relative_url }}" style="color:inherit;text-decoration:none;">Archives</a></span></div></footer>
</body>
</html>
